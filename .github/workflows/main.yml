name: Ruby

on:
  push:
    branches:
      - main
  pull_request:
  # Ruby's nightly moves without riptide changing.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  # Every minor Ruby still maintains that the tracer is written for, plus the
  # latest release with AddressSanitizer for the tracer reading the VM wrong.
  # The weekly run adds every maintained minor riptide installs on, and
  # nightly with and without AddressSanitizer, so a new minor shows up there
  # first instead of failing every push. Each runs on the oldest Minitest the
  # gemspec allows and the newest of each major it allows.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      rubies: ${{ steps.list.outputs.rubies }}
      minitests: ${{ steps.list.outputs.minitests }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          NIGHTLY: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: ruby {0}
        run: |
          require "json"
          require "open-uri"
          require_relative "lib/riptide/version"
          spec = Gem::Specification.load("riptide.gemspec")
          maintained = JSON.parse(URI("https://cache.ruby-lang.org/pub/misc/ci_versions/cruby.json").read).grep(/\A\d/)
          installs = maintained.select { |minor| spec.required_ruby_version.satisfied_by?(Gem::Version.new(minor)) }
          # asan-release is built from the latest release.
          latest = maintained.max_by { |minor| Gem::Version.new(minor) }
          if ENV["NIGHTLY"] == "true"
            rubies = installs + %w[asan-release head asan]
          else
            rubies = installs & Riptide::TRACED_RUBIES
            rubies << "asan-release" if Riptide::TRACED_RUBIES.include?(latest)
          end

          allowed = spec.dependencies.find { |dependency| dependency.name == "minitest" }.requirement
          released = JSON.parse(URI("https://rubygems.org/api/v1/versions/minitest.json").read)
            .reject { |release| release["prerelease"] }
            .map { |release| Gem::Version.new(release["number"]) }
            .select { |version| allowed.satisfied_by?(version) }
          minitests = ([released.min] + released.group_by { |version| version.segments.first }.values.map(&:max)).uniq.sort.map(&:to_s)

          File.write(ENV.fetch("GITHUB_OUTPUT"), "rubies=#{rubies.to_json}\nminitests=#{minitests.to_json}\n", mode: "a")
          puts rubies.inspect, minitests.inspect

  build:
    needs: versions
    # The AddressSanitizer builds only come for 24.04 and later.
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}, Minitest ${{ matrix.minitest }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJson(needs.versions.outputs.rubies) }}
        minitest: ${{ fromJson(needs.versions.outputs.minitests) }}
    env:
      MINITEST: ${{ matrix.minitest }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  # A weekly failure is usually a Ruby that changed under riptide.
  report:
    needs: build
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly build failed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN"
          else
            gh issue create --title "$title" --body "A Ruby riptide tests against changed under it: $RUN"
          fi

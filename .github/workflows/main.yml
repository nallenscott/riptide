name: Ruby

on:
  push:
    branches:
      - main
  pull_request:
  # Ruby's nightly moves without riptide changing.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  # Every minor Ruby still maintains that the tracer is written for, plus the
  # latest release with AddressSanitizer for the tracer reading the VM wrong.
  # Each runs on the oldest Minitest the gemspec allows and the newest of
  # each major it allows. One more job builds riptide without its tracer,
  # the way it installs on a Ruby it isn't written for.
  #
  # The weekly run adds every maintained minor riptide installs on, and
  # nightly with and without AddressSanitizer, all with the tracer built
  # whether it's written for them or not. A failure there is a new Ruby the
  # tracer doesn't work on yet, weeks before it ships, instead of every push
  # failing the day it does.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          NIGHTLY: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
        shell: ruby {0}
        run: |
          require "json"
          require "open-uri"
          require File.expand_path("lib/riptide/version")
          spec = Gem::Specification.load("riptide.gemspec")
          maintained = JSON.parse(URI("https://cache.ruby-lang.org/pub/misc/ci_versions/cruby.json").read).grep(/\A\d/)
          installs = maintained.select { |minor| spec.required_ruby_version.satisfied_by?(Gem::Version.new(minor)) }
          # asan-release is built from the latest release.
          latest = maintained.max_by { |minor| Gem::Version.new(minor) }
          if ENV["NIGHTLY"] == "true"
            rubies = installs + %w[asan-release head asan]
          else
            rubies = installs & Riptide::TRACED_RUBIES
            rubies << "asan-release" if Riptide::TRACED_RUBIES.include?(latest)
          end

          allowed = spec.dependencies.find { |dependency| dependency.name == "minitest" }.requirement
          released = JSON.parse(URI("https://rubygems.org/api/v1/versions/minitest.json").read)
            .reject { |release| release["prerelease"] }
            .map { |release| Gem::Version.new(release["number"]) }
            .select { |version| allowed.satisfied_by?(version) }
          minitests = ([released.min] + released.group_by { |version| version.segments.first }.values.map(&:max)).uniq.sort.map(&:to_s)

          tracer = ENV["NIGHTLY"] == "true" ? "on" : ""
          jobs = rubies.product(minitests).map { |ruby, minitest| { ruby: ruby, minitest: minitest, tracer: tracer } }
          jobs << { ruby: (installs & Riptide::TRACED_RUBIES).max_by { |minor| Gem::Version.new(minor) }, minitest: minitests.last, tracer: "off" }

          File.write(ENV.fetch("GITHUB_OUTPUT"), "jobs=#{jobs.to_json}\n", mode: "a")
          jobs.each { |job| puts job.values.join(" ") }

  build:
    needs: versions
    # The AddressSanitizer builds only come for 24.04 and later.
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}, Minitest ${{ matrix.minitest }}${{ matrix.tracer && format(', tracer {0}', matrix.tracer) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.jobs) }}
    env:
      MINITEST: ${{ matrix.minitest }}
      RIPTIDE_TRACER: ${{ matrix.tracer }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  # The weekly run, or one started by hand, keeps one issue up to date. A
  # failure, usually a Ruby that changed under riptide, opens it or comments
  # on it with what broke, and a pass closes it.
  report:
    needs: build
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.build.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: ruby .github/weekly_report.rb
